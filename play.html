<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

```
<title>Play SWF Game</title>

<link rel="stylesheet" href="css/styles.css" />

<script>
    window.RufflePlayer = window.RufflePlayer || {};

    window.RufflePlayer.config = {
        autoplay: "on",
        unmuteOverlay: "hidden",
        letterbox: "on",
        warnOnUnsupportedContent: false
    };
</script>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
```

</head>

<body>

```
<main class="player-page">

    <a class="back-link" href="./">
        ← Back to games
    </a>

    <div class="player-heading">

        <img
            class="game-page-logo"
            id="game-logo"
            src="images/swf-game-logo.svg"
            alt=""
        />

        <p class="eyebrow">SWF player</p>

        <h1 id="game-name">
            Loading game
        </h1>

    </div>

    <section
        class="player-frame"
        id="player-frame"
        aria-label="Flash game player"
    >

        <div
            id="player"
            class="player-host"
            aria-live="polite"
        >
            <p>Loading Flash player...</p>
        </div>

        <button
            class="fullscreen-button"
            id="fullscreen-button"
            type="button"
            aria-label="Enter fullscreen"
            title="Enter fullscreen">
            ⛶
        </button>

    </section>

    <p
        id="player-error"
        class="player-error"
        hidden>
        Unable to load this SWF file.
    </p>

</main>

<script src="js/player.js"></script>
```

</body>
</html>
